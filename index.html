<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVR Vault & Multi-User Bank</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: rgba(19, 26, 43, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --emerald: #10b981;
      --rose: #f43f5e;
      --amber: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    /* Auth Modal */
    #authOverlay { position: fixed; inset: 0; background: rgba(9, 13, 22, 0.96); backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .auth-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 100%; max-width: 380px; text-align: center; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .user-tag { background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: var(--primary); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; }
    .btn-logout { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; text-decoration: underline; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
    .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; backdrop-filter: blur(12px); margin-bottom: 20px; }
    
    /* Forex Converter */
    .calc-box { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
    .calc-results { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
    .res-card { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; }
    .res-card small { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; font-weight: 700; }
    .res-card div { font-size: 1.25rem; font-weight: 800; margin-top: 4px; }

    /* Envelopes */
    .envelope-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .envelope-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .envelope-card small { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; font-weight: 700; }
    .envelope-card h3 { font-size: 1.3rem; font-weight: 800; margin: 8px 0; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    input, select { width: 100%; background: #0f172a; border: 1px solid var(--border); padding: 11px 14px; border-radius: 8px; color: var(--text); outline: none; }

    .btn-submit { display: block; width: 100%; background: var(--primary); color: #fff; padding: 13px; border-radius: 8px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
    .tag-dep { color: var(--emerald); font-weight: 700; }
    .tag-exp { color: var(--rose); font-weight: 700; }
  </style>
</head>
<body>

<!-- AUTHENTICATION OVERLAY (PIN PROTECTED) -->
<div id="authOverlay">
  <div class="auth-card">
    <div style="font-size: 2.2rem; margin-bottom: 8px;">🔐</div>
    <h2 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 6px;">MVR Vault Access</h2>
    <p style="color: var(--muted); font-size: 0.82rem; margin-bottom: 20px;">Enter your username and 4-digit PIN to unlock your ledger.</p>
    
    <input type="text" id="usernameInput" placeholder="Username (e.g. zain)" style="margin-bottom: 10px; text-align: center;">
    <input type="password" maxlength="4" pattern="[0-9]*" inputmode="numeric" id="pinInput" placeholder="4-Digit PIN (e.g. 1234)" style="margin-bottom: 14px; text-align: center; letter-spacing: 4px; font-size: 1.2rem;">
    
    <div id="authErr" style="color: var(--rose); font-size: 0.8rem; margin-bottom: 12px; display: none;"></div>
    
    <button onclick="handleLogin()" id="btnLogin" class="btn-submit">Unlock Vault</button>
  </div>
</div>

<div class="container" id="mainApp" style="display: none;">
  <header>
    <div>
      <h1 style="font-size: 1.3rem; font-weight: 800;">MVR Vault & Piggy Bank</h1>
      <div id="syncStatus" style="font-size: 0.8rem; color: var(--muted); margin-top: 2px;">● Live Connected</div>
    </div>
    <div class="user-tag">
      <span>👤 <strong id="displayUsername">User</strong></span>
      <button onclick="logoutUser()" class="btn-logout">Switch User</button>
    </div>
  </header>

  <!-- FOREX CALCULATOR -->
  <div class="calc-box">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <span style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--muted);">Forex Sub-Calculator</span>
      <span style="font-size: 0.75rem; color: var(--muted);">MVR ↔ USD</span>
    </div>
    <div class="calc-grid">
      <div>
        <label>Amount</label>
        <input type="number" id="calcAmt" value="1000" oninput="calculateForex()">
      </div>
      <div>
        <label>Direction</label>
        <select id="calcDir" onchange="calculateForex()">
          <option value="MVR_TO_USD">MVR → USD</option>
          <option value="USD_TO_MVR">USD → MVR</option>
        </select>
      </div>
      <div>
        <label>Bank Rate</label>
        <input type="number" step="0.01" id="bankRate" value="15.42" oninput="calculateForex()">
      </div>
      <div>
        <label>Market Rate</label>
        <input type="number" step="0.01" id="marketRate" value="23.00" oninput="calculateForex()">
      </div>
    </div>
    <div class="calc-results">
      <div class="res-card">
        <small>Bank Equivalent (15.42)</small>
        <div id="bankRes">$0.00</div>
      </div>
      <div class="res-card">
        <small>Market Equivalent (Parallel Rate)</small>
        <div id="marketRes" style="color: var(--amber);">$0.00</div>
      </div>
    </div>
  </div>

  <!-- NAVIGATION TABS -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="setTab('envelopes')">Envelopes & Balances</button>
    <button class="tab-btn" onclick="setTab('newTx')">Log Transaction</button>
    <button class="tab-btn" onclick="setTab('history')">Ledger History</button>
  </div>

  <!-- ENVELOPES VIEW -->
  <div id="envelopesTab" class="tab-content active">
    <div class="envelope-grid" id="envelopeCards"></div>
  </div>

  <!-- TRANSACTION FORM -->
  <div id="newTxTab" class="tab-content">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
      <form onsubmit="handleTransactionSubmit(event)">
        <div class="grid-2">
          <div>
            <label>Date</label>
            <input type="date" id="txDate" required>
          </div>
          <div>
            <label>Type</label>
            <select id="txType" required>
              <option value="DEPOSIT">Deposit (IN)</option>
              <option value="EXPENSE">Expense (OUT)</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Category</label>
            <select id="txMainCat" onchange="updateSubCatDropdown()" required>
              <option value="Self Use">Self Use</option>
              <option value="Parents">Parents</option>
              <option value="Savings">Savings</option>
            </select>
          </div>
          <div>
            <label>Sub-Category</label>
            <select id="txSubCat" required></select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Amount (MVR)</label>
            <input type="number" step="0.01" min="0.1" id="txAmount" placeholder="0.00" required>
          </div>
          <div>
            <label>Notes</label>
            <input type="text" id="txNotes" placeholder="Description / purpose">
          </div>
        </div>

        <button type="submit" id="btnSubmitTx" class="btn-submit">Record Transaction</button>
      </form>
    </div>
  </div>

  <!-- HISTORY VIEW -->
  <div id="historyTab" class="tab-content">
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="5" style="text-align: center; color: var(--muted);">Loading records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // -------------------------------------------------------------
  // CONFIGURATION: Paste your Google Apps Script URL here
  // -------------------------------------------------------------
  const API_URL = "https://script.google.com/macros/s/AKfycbzlcLdr7TVVHZ1_avjS7ZsKLypoHHjLQ4ubTlnlkzeQY7KuyfwXI4vZJZJXNmJfdmDt/exec";

  const CATEGORY_MAP = {
    "Self Use": ["Subscriptions", "Loans", "Misc"],
    "Parents": ["General / Family"],
    "Savings": ["Emergency Vault"]
  };

  let activeUser = localStorage.getItem("mvr_user");
  let activePin = localStorage.getItem("mvr_pin");

  window.onload = () => {
    const now = new Date();
    const localDate = [
      now.getFullYear(),
      String(now.getMonth() + 1).padStart(2, '0'),
      String(now.getDate()).padStart(2, '0')
    ].join('-');
    document.getElementById('txDate').value = localDate;
    
    updateSubCatDropdown();
    calculateForex();

    if (activeUser && activePin) {
      validateAndLoad(activeUser, activePin);
    }
  };

  async function handleLogin() {
    const user = document.getElementById("usernameInput").value.trim().toLowerCase();
    const pin = document.getElementById("pinInput").value.trim();
    const errDiv = document.getElementById("authErr");
    const btn = document.getElementById("btnLogin");

    if (!user) return showError("Please enter a username.");
    if (pin.length !== 4) return showError("PIN must be exactly 4 digits.");

    btn.innerText = "Verifying...";
    btn.disabled = true;
    errDiv.style.display = "none";

    await validateAndLoad(user, pin);
    btn.innerText = "Unlock Vault";
    btn.disabled = false;
  }

  function showError(msg) {
    const err = document.getElementById("authErr");
    err.innerText = msg;
    err.style.display = "block";
  }

  async function validateAndLoad(user, pin) {
    try {
      const res = await fetch(`${API_URL}?userId=${encodeURIComponent(user)}&pin=${encodeURIComponent(pin)}&t=${Date.now()}`);
      const data = await res.json();

      if (data.status === "invalid_pin") {
        showError("Incorrect 4-digit PIN for this profile.");
        return;
      }

      // Save credentials locally
      localStorage.setItem("mvr_user", user);
      localStorage.setItem("mvr_pin", pin);
      activeUser = user;
      activePin = pin;

      document.getElementById("authOverlay").style.display = "none";
      document.getElementById("mainApp").style.display = "block";
      document.getElementById("displayUsername").innerText = user;

      renderBalances(data.balances);
      renderLogs(data.logs);
      document.getElementById("syncStatus").innerText = "● Connected";
    } catch (e) {
      showError("Connection failed. Verify API URL or network.");
    }
  }

  function logoutUser() {
    localStorage.removeItem("mvr_user");
    localStorage.removeItem("mvr_pin");
    activeUser = null;
    activePin = null;
    document.getElementById("mainApp").style.display = "none";
    document.getElementById("authOverlay").style.display = "flex";
    document.getElementById("pinInput").value = "";
  }

  function setTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(tabId + 'Tab').classList.add('active');
  }

  function updateSubCatDropdown() {
    const main = document.getElementById('txMainCat').value;
    const subSelect = document.getElementById('txSubCat');
    subSelect.innerHTML = CATEGORY_MAP[main].map(s => `<option value="${s}">${s}</option>`).join('');
  }

  function calculateForex() {
    const amt = parseFloat(document.getElementById('calcAmt').value) || 0;
    const dir = document.getElementById('calcDir').value;
    const bankRate = parseFloat(document.getElementById('bankRate').value) || 15.42;
    const marketRate = parseFloat(document.getElementById('marketRate').value) || 23.00;

    if (dir === "MVR_TO_USD") {
      document.getElementById('bankRes').innerText = `$${(amt / bankRate).toFixed(2)}`;
      document.getElementById('marketRes').innerText = `$${(amt / marketRate).toFixed(2)}`;
    } else {
      document.getElementById('bankRes').innerText = `MVR ${(amt * bankRate).toFixed(2)}`;
      document.getElementById('marketRes').innerText = `MVR ${(amt * marketRate).toFixed(2)}`;
    }
  }

  function renderBalances(balances) {
    const container = document.getElementById('envelopeCards');
    if (!balances || !balances.length) {
      container.innerHTML = `<div style="color: var(--muted);">No envelopes found.</div>`;
      return;
    }
    container.innerHTML = balances.map(b => `
      <div class="envelope-card">
        <small>${b.mainCategory} · ${b.subCategory}</small>
        <h3>MVR ${b.currentBalance.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</h3>
      </div>
    `).join('');
  }

  function renderLogs(logs) {
    const tbody = document.getElementById('logTableBody');
    if (!logs || !logs.length) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--muted);">No transactions recorded yet.</td></tr>`;
      return;
    }
    tbody.innerHTML = logs.map(l => `
      <tr>
        <td>${l.date}</td>
        <td><span class="${l.type === 'DEPOSIT' ? 'tag-dep' : 'tag-exp'}">${l.type}</span></td>
        <td><strong>${l.mainCategory}</strong> <span style="color: var(--muted);">(${l.subCategory})</span></td>
        <td><strong>MVR ${l.amount.toFixed(2)}</strong></td>
        <td>${l.notes || '-'}</td>
      </tr>
    `).join('');
  }

  async function handleTransactionSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmitTx');
    btn.innerText = "Saving...";
    btn.disabled = true;

    const payload = {
      userId: activeUser,
      date: document.getElementById('txDate').value,
      type: document.getElementById('txType').value,
      mainCategory: document.getElementById('txMainCat').value,
      subCategory: document.getElementById('txSubCat').value,
      amount: document.getElementById('txAmount').value,
      notes: document.getElementById('txNotes').value
    };

    // Fixed submission handling to prevent false errors
    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      // Reset Form
      document.getElementById('txAmount').value = "";
      document.getElementById('txNotes').value = "";
      
      // Auto-refresh balances after Google writes the row
      setTimeout(() => {
        validateAndLoad(activeUser, activePin);
      }, 1200);

      setTab('envelopes');
    } catch (err) {
      alert("Network error: Could not reach backend.");
    } finally {
      btn.innerText = "Record Transaction";
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
